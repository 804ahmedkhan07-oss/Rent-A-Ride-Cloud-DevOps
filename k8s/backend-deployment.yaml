apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ahmedmateen07/rent-a-ride-backend:latest
          ports:
            - containerPort: 3000

          env:
            - name: mongo_uri
              value: mongodb://mongodb-service:27017/rent-a-ride
