name: Task15 CI/CD

on:
  push:
    branches:
      - feature/task15-github-actions-cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Version
        run: echo "IMAGE_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rent-a-ride-frontend:${{ env.IMAGE_TAG }} -f client/Dockerfile .

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rent-a-ride-backend:${{ env.IMAGE_TAG }} -f backend/Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/rent-a-ride-frontend:${{ env.IMAGE_TAG }}

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/rent-a-ride-backend:${{ env.IMAGE_TAG }}
